name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.3', '8.4', '8.5']
    name: test (PHP ${{ matrix.php }}, ${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      # pcntl and posix carry the kernel's interrupt handling and child
      # reaping; sockets carries the engine's channel to the transport.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix, sockets
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest

      # The dispatcher's two documented exit paths, checked against the real
      # binary rather than only through the unit suite.
      - name: juphyter lists its commands
        run: |
          php bin/juphyter
          php bin/juphyter > /dev/null

      - name: juphyter rejects an unknown command
        run: |
          if php bin/juphyter frobnicate 2>/dev/null; then
            echo "expected a non-zero exit code" >&2
            exit 1
          fi

  family:
    # The display formatters against the packages they format. None of the three
    # is a dependency of juphyter, which has to install and run with any subset
    # of the family present, so the job above is the "none" set and this one
    # adds them with `composer require --dev` rather than by declaring them.
    #
    # phiz requires PHP 8.5, so below that the set is phibble and phplyr alone,
    # as the siblings do it. vl-convert comes from its Python package so the
    # static-SVG path runs here instead of skipping.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    name: family (PHP ${{ matrix.php }})

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install vl-convert-python==1.9.0

      - run: composer require --dev --no-interaction --no-progress --prefer-source
               "phpstats/phibble:^0.3" "phpstats/phplyr:^0.3"

      - if: matrix.php == '8.5'
        run: composer require --dev --no-interaction --no-progress --prefer-source
               "erikwestlund/phiz:^0.3"

      - run: vendor/bin/pest
