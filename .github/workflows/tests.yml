name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.3', '8.4', '8.5']
    name: test (PHP ${{ matrix.php }}, ${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      # mbstring is required. pcntl carries the kernel's interrupt handling,
      # and posix lets the interrupt tests send SIGINT; without either those
      # tests skip. juphyter uses no sockets extension: the engine's channel
      # to the transport is a core stream socket.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest

      # The dispatcher's two documented exit paths, checked against the real
      # binary rather than only through the unit suite.
      - name: juphyter lists its commands
        run: |
          php bin/juphyter
          php bin/juphyter > /dev/null

      - name: juphyter rejects an unknown command
        run: |
          if php bin/juphyter frobnicate 2>/dev/null; then
            echo "expected a non-zero exit code" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint
